<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Options</title>
    <style>
      :root {
        --accent: #0a7d4f;
        --bg: #fff;
        --text: #1a1a1a;
        --muted: #666;
        --border: #e0e0e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #3dd68c;
          --bg: #121212;
          --text: #f0f0f0;
          --muted: #aaa;
          --border: #333;
        }
      }
      body {
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Vazirmatn", Tahoma, sans-serif;
        line-height: 1.9;
      }
      h1 {
        color: var(--accent);
      }
      h2 {
        margin-top: 2rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.3rem;
        font-size: 1.1rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 0.5rem;
      }
      li .domain {
        font-family: monospace;
        direction: ltr;
        text-align: left;
        flex: 1;
      }
      li .state {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 10px;
        margin: 0 8px;
      }
      li .state.on {
        background: #0a7d4f;
        color: #fff;
      }
      li .state.off {
        background: #999;
        color: #fff;
      }
      li button {
        background: #c43838;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 0.2rem 0.6rem;
        cursor: pointer;
        font-family: inherit;
      }
      button.action {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 0.6rem 1rem;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
      }
      input[type="file"] {
        margin-right: 0.5rem;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .big-toggle {
        font-size: 15px;
        padding: 0.8rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(10, 125, 79, 0.06);
      }
    </style>
  </head>
  <body>
    <h1 id="optTitle"></h1>

    <h2 id="optGlobalTitle"></h2>
    <label class="big-toggle">
      <input type="checkbox" id="chkGlobal" />
      <span id="lblGlobal"></span>
    </label>
    <p class="muted" id="optGlobalDesc"></p>

    <h2 id="optDomainsTitle"></h2>
    <ul id="domains"></ul>
    <p id="empty" class="muted"></p>
    <button id="clear" class="action"></button>

    <h2 id="optBackupTitle"></h2>
    <div class="row">
      <button id="export" class="action"></button>
      <input type="file" id="import" accept=".json" />
    </div>
    <p class="muted" id="importMsg"></p>

    <script src="options.js"></script>
  </body>
</html>
