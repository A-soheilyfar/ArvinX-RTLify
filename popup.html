<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --accent: #0a7d4f;
        --bg: #fff;
        --text: #1a1a1a;
        --muted: #666;
        --border: #e0e0e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #3dd68c;
          --bg: #1a1a1a;
          --text: #f0f0f0;
          --muted: #aaa;
          --border: #333;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        color: var(--accent);
      }
      .host {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 12px;
        direction: ltr;
        text-align: left;
      }
      .primary {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .primary.on {
        background: #c43838;
      }
      .section {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .section h2 {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 8px;
        font-weight: normal;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        padding: 3px 0;
      }
      .radios {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .radios label {
        flex: 1;
      }
      .link {
        background: none;
        border: none;
        padding: 4px 0;
        color: var(--accent);
        text-align: right;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        text-decoration: underline;
        margin-top: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        margin: 6px 0 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1 id="extName">ArvinX RTLify</h1>
    <p class="host" id="host"></p>
    <button id="toggleBtn" class="primary" disabled>
      <span id="btnText"></span>
    </button>

    <div class="section">
      <h2 id="smartTitle"></h2>
      <div class="radios">
        <label
          ><input type="radio" name="smart" value="off" />
          <span id="lblSmartOff"></span
        ></label>
        <label
          ><input type="radio" name="smart" value="safe" />
          <span id="lblSmartSafe"></span
        ></label>
        <label
          ><input type="radio" name="smart" value="aggressive" />
          <span id="lblSmartAgg"></span
        ></label>
      </div>
      <p class="hint" id="smartHint"></p>
    </div>

    <div class="section">
      <label
        ><input type="checkbox" id="chkTextAlign" /> <span id="lblAlign"></span
      ></label>
      <label
        ><input type="checkbox" id="chkFont" /> <span id="lblFont"></span
      ></label>
      <label
        ><input type="checkbox" id="chkGlobal" /> <span id="lblGlobal"></span
      ></label>
      <button id="optionsBtn" class="link" id="btnOpts"></button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
