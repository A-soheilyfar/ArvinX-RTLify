<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --accent: #0a7d4f;
        --bg: #fff;
        --text: #1a1a1a;
        --muted: #666;
        --border: #e0e0e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #3dd68c;
          --bg: #1a1a1a;
          --text: #f0f0f0;
          --muted: #aaa;
          --border: #333;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
        color: var(--accent);
      }
      .host {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 12px;
        direction: ltr;
        text-align: left;
      }
      .primary {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s;
      }
      .primary:hover:not(:disabled) {
        opacity: 0.9;
      }
      .primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .primary.on {
        background: #c43838;
      }
      .options {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .link {
        background: none;
        border: none;
        padding: 4px 0;
        color: var(--accent);
        text-align: right;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        text-decoration: underline;
      }
      .info {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>RTL Toggle Pro</h1>
    <p class="host" id="host"></p>
    <button id="toggleBtn" class="primary" disabled>
      <span id="btnText">در حال بررسی...</span>
    </button>
    <div class="options">
      <label
        ><input type="checkbox" id="chkTextAlign" /> راست‌چین کردن متن</label
      >
      <label
        ><input type="checkbox" id="chkFont" /> فونت فارسی (Vazirmatn)</label
      >
      <button id="optionsBtn" class="link">مدیریت دامنه‌ها…</button>
    </div>
    <p class="info" id="info"></p>
    <script src="popup.js"></script>
  </body>
</html>
